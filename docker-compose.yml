name: smartclaims-v2
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartclaims
      POSTGRES_USER: smartclaims
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure_demo.py first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartclaims -d smartclaims"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      DATABASE_URL: postgresql+psycopg://smartclaims:${POSTGRES_PASSWORD}@db:5432/smartclaims
      DEMO_IDENTITIES_FILE: /run/identities.json
    volumes:
      - ./work/demo-identities.json:/run/identities.json:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: ./apps/web
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:
