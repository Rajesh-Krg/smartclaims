name: Backend and database tests
on:
  push:
    branches: [main, 'feat/**', 'rebuild/**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smartclaims_test
          POSTGRES_USER: smartclaims
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smartclaims -d smartclaims_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://smartclaims:synthetic-ci-only@localhost:5432/smartclaims_test
      TEST_DATABASE_URL: postgresql+psycopg://smartclaims:synthetic-ci-only@localhost:5432/smartclaims_test
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: alembic -c backend/alembic.ini upgrade head
      - run: alembic -c backend/alembic.ini check
      - run: pytest backend/tests -q
